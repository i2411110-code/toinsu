<section class="silson-wrap toss">
  <div class="silson-box">

    <!-- 헤더 -->
    <div class="toss-hero" style="padding:24px 24px 26px; margin-bottom:16px;">
      <button class="toss-home-btn" onclick="window.navigateTo('page-claim-main')">
        <i class="bi bi-arrow-left"></i> 청구의 모든것
      </button>
      <div class="toss-hero-tag"><i class="bi bi-calculator-fill"></i> 실비계산기</div>
      <p class="toss-hero-sub">세대별 실손 예상 보험금을 한눈에</p>
      <h1 class="toss-hero-title" style="font-size:22px;">실손 예상 보험금<br>계산기</h1>
    </div>

    <!-- 세대 선택 -->
    <div class="toss-card">
      <div class="toss-card-title" style="margin-bottom:16px;">세대 선택</div>
      <div class="silson-gen-grid" id="silson-gen-grid"></div>
    </div>

    <!-- 통원/입원 탭 -->
    <div class="toss-card">
      <div class="toss-card-title" style="margin-bottom:16px;">진료 유형</div>
      <div class="silson-type-toggle">
        <button class="silson-type-btn active" id="btn-outpatient" onclick="window.switchSilsonType('outpatient')">통원</button>
        <button class="silson-type-btn" id="btn-inpatient" onclick="window.switchSilsonType('inpatient')">입원</button>
      </div>
    </div>

    <!-- ===== 통원 입력 영역 ===== -->
    <div id="silson-outpatient-area">

      <!-- 통원 외래 (1~4세대, 유병자) -->
      <div class="toss-card" id="silson-outpatient-legacy-card">
        <div class="toss-card-title" style="margin-bottom:16px;">통원 (외래)</div>
        <div class="silson-group" id="silson-limit-group">
          <label>통원비 한도</label>
          <select id="silson-limit-select" class="silson-select" onchange="window.silsonState.limitIdx=Number(this.value); window.renderSilsonResult()"></select>
        </div>
        <div class="silson-group">
          <label>병원 등급</label>
          <div class="silson-grade-btns">
            <button class="silson-grade-btn active" data-grade="clinic" onclick="window.selectSilsonGrade('clinic')">병·의원</button>
            <button class="silson-grade-btn" data-grade="hospital" onclick="window.selectSilsonGrade('hospital')">종합병원</button>
            <button class="silson-grade-btn" data-grade="general" onclick="window.selectSilsonGrade('general')">상급종합병원</button>
          </div>
        </div>
        <div class="silson-row">
          <div class="silson-group">
            <label>급여</label>
            <input type="number" id="silson-gubun" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()">
          </div>
          <div class="silson-group">
            <label>비급여</label>
            <input type="number" id="silson-nongubun" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()">
          </div>
        </div>
        <div class="silson-result-mini" id="silson-outpatient-result"></div>
      </div>

      <!-- 5세대 통원 전용 UI -->
      <div id="silson-gen5-outpatient-area" style="display:none;">
        <div class="toss-card">
          <div class="toss-card-title" style="margin-bottom:16px;">통원 (급여)</div>
          <div class="silson-group">
            <label>병원 등급</label>
            <div class="silson-grade-btns">
              <button class="silson-grade-btn active" data-grade="clinic" onclick="window.selectSilsonGrade('clinic')">병·의원</button>
              <button class="silson-grade-btn" data-grade="hospital" onclick="window.selectSilsonGrade('hospital')">종합병원</button>
              <button class="silson-grade-btn" data-grade="general" onclick="window.selectSilsonGrade('general')">상급종합병원</button>
            </div>
          </div>
          <div class="silson-group">
            <label>급여 금액</label>
            <input type="number" id="silson-g5-out-gubun" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()">
          </div>
          <div class="silson-result-mini" id="silson-g5-out-gubun-result"></div>
        </div>
        <div class="toss-card">
          <div class="toss-card-title" style="margin-bottom:16px;">통원 (비급여)</div>
          <div class="silson-row">
            <div class="silson-group">
              <label>중증 비급여</label>
              <input type="number" id="silson-g5-out-severe" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()">
            </div>
            <div class="silson-group">
              <label>비중증 비급여</label>
              <input type="number" id="silson-g5-out-mild" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()">
            </div>
          </div>
          <div class="silson-result-mini" id="silson-g5-out-nongubun-result"></div>
        </div>
      </div>

      <!-- 약제비 (2세대, 3세대만) -->
      <div class="toss-card" id="silson-prescription-card" style="display:none;">
        <div class="toss-card-title" style="margin-bottom:16px;">통원 (약제)</div>
        <div class="silson-row">
          <div class="silson-group">
            <label>급여</label>
            <input type="number" id="silson-presc-gubun" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()">
          </div>
          <div class="silson-group">
            <label>비급여</label>
            <input type="number" id="silson-presc-nongubun" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()">
          </div>
        </div>
        <div class="silson-result-mini" id="silson-prescription-result"></div>
      </div>

      <!-- 비급여 3종 통원 (3세대, 4세대) -->
      <div class="toss-card" id="silson-type3-card" style="display:none;">
        <div class="toss-card-title" style="margin-bottom:16px;">비급여 3종 (통원)</div>
        <div class="silson-row">
          <div class="silson-group"><label>비급여 주사제</label><input type="number" id="silson-injection" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
          <div class="silson-group"><label>공제액</label><input type="text" id="silson-injection-deduct" class="silson-input silson-readonly" readonly></div>
        </div>
        <div class="silson-row">
          <div class="silson-group"><label>도수치료 / 체외충격파</label><input type="number" id="silson-manual" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
          <div class="silson-group"><label>공제액</label><input type="text" id="silson-manual-deduct" class="silson-input silson-readonly" readonly></div>
        </div>
        <div class="silson-row">
          <div class="silson-group"><label>MRI / MRA</label><input type="number" id="silson-mri" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
          <div class="silson-group"><label>공제액</label><input type="text" id="silson-mri-deduct" class="silson-input silson-readonly" readonly></div>
        </div>
        <div class="silson-result-mini" id="silson-type3-result"></div>
      </div>

      <!-- 5세대 비급여 3종 통원 -->
      <div class="toss-card" id="silson-g5-type3-out-card" style="display:none;">
        <div class="toss-card-title" style="margin-bottom:16px;">비급여 3종 (통원)</div>
        <div style="display:flex; gap:8px; margin-bottom:14px;">
          <button class="silson-grade-btn active" id="g5-type3-out-severe-btn" onclick="window.switchG5Type3('out','severe')">중증</button>
          <button class="silson-grade-btn" id="g5-type3-out-mild-btn" onclick="window.switchG5Type3('out','mild')">비중증</button>
        </div>
        <div id="g5-type3-out-severe-area">
          <div class="silson-row">
            <div class="silson-group"><label>도수치료</label><input type="number" id="silson-g5-out-manual" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>공제액</label><input type="text" id="silson-g5-out-manual-deduct" class="silson-input silson-readonly" readonly></div>
          </div>
          <div class="silson-row">
            <div class="silson-group"><label>비급여 주사제</label><input type="number" id="silson-g5-out-injection" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>공제액</label><input type="text" id="silson-g5-out-injection-deduct" class="silson-input silson-readonly" readonly></div>
          </div>
          <div class="silson-row">
            <div class="silson-group"><label>MRI / MRA</label><input type="number" id="silson-g5-out-mri" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>공제액</label><input type="text" id="silson-g5-out-mri-deduct" class="silson-input silson-readonly" readonly></div>
          </div>
        </div>
        <div id="g5-type3-out-mild-area" style="display:none;">
          <div class="silson-row">
            <div class="silson-group"><label>MRI / MRA (비중증)</label><input type="number" id="silson-g5-out-mri-mild" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>공제액</label><input type="text" id="silson-g5-out-mri-mild-deduct" class="silson-input silson-readonly" readonly></div>
          </div>
        </div>
        <div class="silson-result-mini" id="silson-g5-type3-out-result"></div>
      </div>

    </div><!-- /outpatient-area -->

    <!-- ===== 입원 입력 영역 ===== -->
    <div id="silson-inpatient-area" style="display:none;">

      <!-- 1~4세대, 유병자 입원 -->
      <div class="toss-card" id="silson-inpatient-legacy-card">
        <div class="toss-card-title" style="margin-bottom:16px;">입원</div>
        <div class="silson-row">
          <div class="silson-group"><label>급여</label><input type="number" id="silson-inp-gubun" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
          <div class="silson-group"><label>비급여</label><input type="number" id="silson-inp-nongubun" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
        </div>
        <div class="silson-row">
          <div class="silson-group"><label>입원일수</label><input type="number" id="silson-days" class="silson-input" placeholder="1" value="1" oninput="window.renderSilsonResult()"></div>
          <div class="silson-group">
            <label>병실</label>
            <select id="silson-room" class="silson-select" onchange="window.renderSilsonResult()">
              <option value="standard">기준병실</option>
              <option value="premium">상급병실</option>
            </select>
          </div>
        </div>
        <div id="silson-room-extra" style="display:none;">
          <div class="silson-group"><label>상급병실료 차액 (1일)</label><input type="number" id="silson-room-diff" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
        </div>
        <div class="silson-result-mini" id="silson-inpatient-result"></div>
      </div>

      <!-- 5세대 입원 전용 UI -->
      <div id="silson-gen5-inpatient-area" style="display:none;">
        <div class="toss-card">
          <div class="toss-card-title" style="margin-bottom:16px;">입원 (급여)</div>
          <div class="silson-group">
            <label>병원 등급</label>
            <div class="silson-grade-btns">
              <button class="silson-grade-btn active" data-grade="clinic" onclick="window.selectSilsonGrade('clinic')">병·의원</button>
              <button class="silson-grade-btn" data-grade="hospital" onclick="window.selectSilsonGrade('hospital')">종합병원</button>
              <button class="silson-grade-btn" data-grade="general" onclick="window.selectSilsonGrade('general')">상급종합병원</button>
            </div>
          </div>
          <div class="silson-group">
            <label>급여 금액</label>
            <input type="number" id="silson-g5-inp-gubun" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()">
          </div>
          <div class="silson-result-mini" id="silson-g5-inp-gubun-result"></div>
        </div>
        <div class="toss-card">
          <div class="toss-card-title" style="margin-bottom:16px;">입원 (비급여)</div>
          <div class="silson-row">
            <div class="silson-group"><label>중증 비급여</label><input type="number" id="silson-g5-inp-severe" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>비중증 비급여</label><input type="number" id="silson-g5-inp-mild" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
          </div>
          <div class="silson-result-mini" id="silson-g5-inp-nongubun-result"></div>
        </div>
      </div>

      <!-- 비급여 3종 입원 (3세대, 4세대) -->
      <div class="toss-card" id="silson-inp-type3-card" style="display:none;">
        <div class="toss-card-title" style="margin-bottom:16px;">비급여 3종 (입원)</div>
        <div class="silson-row">
          <div class="silson-group"><label>비급여 주사제</label><input type="number" id="silson-inp-injection" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
          <div class="silson-group"><label>공제액</label><input type="text" id="silson-inp-injection-deduct" class="silson-input silson-readonly" readonly></div>
        </div>
        <div class="silson-row">
          <div class="silson-group"><label>도수치료 / 체외충격파</label><input type="number" id="silson-inp-manual" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
          <div class="silson-group"><label>공제액</label><input type="text" id="silson-inp-manual-deduct" class="silson-input silson-readonly" readonly></div>
        </div>
        <div class="silson-row">
          <div class="silson-group"><label>MRI / MRA</label><input type="number" id="silson-inp-mri" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
          <div class="silson-group"><label>공제액</label><input type="text" id="silson-inp-mri-deduct" class="silson-input silson-readonly" readonly></div>
        </div>
        <div class="silson-result-mini" id="silson-inp-type3-result"></div>
      </div>

      <!-- 5세대 비급여 3종 입원 -->
      <div class="toss-card" id="silson-g5-type3-inp-card" style="display:none;">
        <div class="toss-card-title" style="margin-bottom:16px;">비급여 3종 (입원)</div>
        <div style="display:flex; gap:8px; margin-bottom:14px;">
          <button class="silson-grade-btn active" id="g5-type3-inp-severe-btn" onclick="window.switchG5Type3('inp','severe')">중증</button>
          <button class="silson-grade-btn" id="g5-type3-inp-mild-btn" onclick="window.switchG5Type3('inp','mild')">비중증</button>
        </div>
        <div id="g5-type3-inp-severe-area">
          <div class="silson-row">
            <div class="silson-group"><label>도수치료</label><input type="number" id="silson-g5-inp-manual" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>공제액</label><input type="text" id="silson-g5-inp-manual-deduct" class="silson-input silson-readonly" readonly></div>
          </div>
          <div class="silson-row">
            <div class="silson-group"><label>비급여 주사제</label><input type="number" id="silson-g5-inp-injection" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>공제액</label><input type="text" id="silson-g5-inp-injection-deduct" class="silson-input silson-readonly" readonly></div>
          </div>
          <div class="silson-row">
            <div class="silson-group"><label>MRI / MRA</label><input type="number" id="silson-g5-inp-mri" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>공제액</label><input type="text" id="silson-g5-inp-mri-deduct" class="silson-input silson-readonly" readonly></div>
          </div>
        </div>
        <div id="g5-type3-inp-mild-area" style="display:none;">
          <div class="silson-row">
            <div class="silson-group"><label>MRI / MRA (비중증)</label><input type="number" id="silson-g5-inp-mri-mild" class="silson-input" placeholder="0" oninput="window.renderSilsonResult()"></div>
            <div class="silson-group"><label>공제액</label><input type="text" id="silson-g5-inp-mri-mild-deduct" class="silson-input silson-readonly" readonly></div>
          </div>
        </div>
        <div class="silson-result-mini" id="silson-g5-type3-inp-result"></div>
      </div>

    </div><!-- /inpatient-area -->

    <!-- 최종 결과 -->
    <div class="silson-total" id="silson-total-card">
      <div class="silson-total-label" id="silson-total-label">통원 예상 보험금</div>
      <div class="silson-total-amount" id="silson-total-amount">0원</div>
      <p class="silson-total-notice">보상 제외 질환 및 실손 약관에 따라 실제 보험금은 상이할 수 있습니다.</p>
    </div>

  </div>
</section>

<!-- ===== 실손 사전 플로팅 버튼 ===== -->
<button onclick="window.openSilsonDict()" style="
  position:fixed; left:20px; bottom:100px; z-index:200;
  width:52px; height:52px; border-radius:50%; border:none;
  background:#191F28; color:white; font-size:20px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.18); cursor:pointer;">
  <i class="bi bi-book"></i>
</button>

<!-- ===== 실손 사전 모달 ===== -->
<div id="silson-dict-modal" style="display:none; position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,0.45); align-items:flex-end; justify-content:center;">
  <div style="background:white; width:100%; max-width:600px; border-radius:24px 24px 0 0; max-height:88vh; display:flex; flex-direction:column; overflow:hidden;">
    <!-- 모달 헤더 -->
    <div style="padding:20px 20px 0; flex-shrink:0;">
      <div style="width:40px; height:4px; background:#E5E8EB; border-radius:2px; margin:0 auto 16px;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
          <div style="font-size:18px; font-weight:800; color:#191F28;">📖 실손 사전</div>
          <div style="font-size:12px; color:#8B95A1; margin-top:2px;" id="silson-dict-gen-label">세대를 선택하면 정보가 표시됩니다</div>
        </div>
        <button onclick="window.closeSilsonDict()" style="background:none; border:none; font-size:22px; color:#8B95A1; cursor:pointer;"><i class="bi bi-x"></i></button>
      </div>
      <!-- 세대 선택 -->
      <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch;">
        <button class="dict-gen-btn active" onclick="window.switchDictGen('1세대')" style="white-space:nowrap;">1세대</button>
        <button class="dict-gen-btn" onclick="window.switchDictGen('2세대 1차')" style="white-space:nowrap;">2세대 1차</button>
        <button class="dict-gen-btn" onclick="window.switchDictGen('2세대 2차')" style="white-space:nowrap;">2세대 2차</button>
        <button class="dict-gen-btn" onclick="window.switchDictGen('2세대 3차')" style="white-space:nowrap;">2세대 3차</button>
        <button class="dict-gen-btn" onclick="window.switchDictGen('3세대')" style="white-space:nowrap;">3세대</button>
        <button class="dict-gen-btn" onclick="window.switchDictGen('4세대')" style="white-space:nowrap;">4세대</button>
        <button class="dict-gen-btn" onclick="window.switchDictGen('5세대')" style="white-space:nowrap;">5세대</button>
        <button class="dict-gen-btn" onclick="window.switchDictGen('유병자')" style="white-space:nowrap;">유병자</button>
      </div>
      <!-- 탭 -->
      <div style="display:flex; background:#F2F4F6; padding:4px; border-radius:12px; gap:4px; margin-bottom:0;">
        <button class="dict-tab-btn active" id="dict-tab-info" onclick="window.switchDictTab('info')">실손정보</button>
        <button class="dict-tab-btn" id="dict-tab-selfpay" onclick="window.switchDictTab('selfpay')">자기부담금</button>
        <button class="dict-tab-btn" id="dict-tab-waiting" onclick="window.switchDictTab('waiting')">면책기간</button>
        <button class="dict-tab-btn" id="dict-tab-exclude" onclick="window.switchDictTab('exclude')">면책사항</button>
      </div>
    </div>
    <!-- 모달 바디 -->
    <div id="silson-dict-body" style="padding:16px 20px 30px; overflow-y:auto; flex:1;"></div>
  </div>
</div>

<style>
.silson-wrap.toss { padding: 0 0 30px; }
